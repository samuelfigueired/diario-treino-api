spring:
  application:
    name: diario-treino-api
  datasource:
    url: jdbc:h2:mem:diariotreino;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    origens: http://localhost:8081,http://localhost:19006
