spring:
  datasource:
    # APP_DB_URL completa, ou as partes (host, porta, nome) como o Render fornece.
    url: ${APP_DB_URL:jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORTA:5432}/${APP_DB_NOME}}
    username: ${APP_DB_USUARIO}
    password: ${APP_DB_SENHA}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
  h2:
    console:
      enabled: false

springdoc:
  swagger-ui:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  cors:
    # Versão web do app no Expo Hosting (*.expo.app) e o servidor de desenvolvimento do Expo.
    origens: ${APP_CORS_ORIGENS:https://*.expo.app,http://localhost:8081}
